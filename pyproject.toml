[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nsa-campus-network"
description = "Campus Network Traffic Analysis & Security Visualization System"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Starlux-Arch"},
]
requires-python = ">=3.8"
dependencies = [
    "Flask==2.3.2",
    "Werkzeug==2.3.6",
    "numpy<2",
    "pandas==2.0.3",
    "plotly==6.7.0",
    "scikit-learn>=1.3,<1.7",
]

[tool.setuptools.packages.find]
include = ["utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist"]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.coverage.run]
source = ["utils", "app.py"]
omit = ["tests/*", "**/__pycache__/*", "**/test_*"]
